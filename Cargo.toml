[package]
name = "flatpak-rs"
version = "0.1.0"
edition = "2024"
default-run = "flatpak-rs"

[dependencies]
libc = "0.2"
hex = "0.4"
ostree = { version = "0.20.5", features = ["v2021_4"] }
gio = "0.20"
glib = { version = "0.20", features = ["v2_66"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
